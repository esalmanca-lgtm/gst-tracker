<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628" />
      <stop offset="100%" stop-color="#07090f" />
    </linearGradient>
    <!-- Primary Blue-Green Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Rect Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
  
  <!-- Glowing Graphic Group -->
  <g filter="url(#glow)">
    <!-- Base Board Icon -->
    <rect x="128" y="112" width="256" height="304" rx="24" fill="none" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Checklist Top Clip -->
    <rect x="208" y="80" width="96" height="48" rx="12" fill="#0f1f3d" stroke="url(#primaryGrad)" stroke-width="12"/>
    
    <!-- Stage lines / Chart lines -->
    <line x1="176" y1="192" x2="336" y2="192" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
    <line x1="176" y1="256" x2="336" y2="256" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
    <line x1="176" y1="320" x2="272" y2="320" stroke="url(#primaryGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Big glowing green checkmark -->
    <path d="M 288 340 L 328 380 L 400 290" fill="none" stroke="#22c55e" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
